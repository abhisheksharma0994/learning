title: Learning
tagline: POCs, measured properly
description: >-
  Proofs of concept I build, written up with honest numbers: what worked, what
  did not, and how to run each one locally.
author: Abhishek Sharma

# GitHub Pages serves this repo at /learning, so baseurl matters: every internal
# link goes through the relative_url filter.
url: "https://abhisheksharma0994.github.io"
baseurl: "/learning"
github_url: "https://github.com/abhisheksharma0994/learning"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: pocs
    values:
      layout: poc

# One page per POC, served at /pocs/<name>/ alongside the code under /pocs in the
# repo. The page IS the write-up, so there is no separate posts section and
# nothing to keep in sync between the two.
collections:
  pocs:
    output: true
    permalink: /pocs/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
